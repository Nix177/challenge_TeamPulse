<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Pulse — Check-in collectif</title>
  <meta name="description" content="Check-in de 30 secondes pour réunions, ateliers et cours.">
  <link rel="stylesheet" href="styles.css?v=20260806-checkin">
</head>
<body>

  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>

  <!-- ARIA Live Announcement Region -->
  <div id="aria-announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Header -->
  <header class="app-header" role="banner">
    <div class="brand-block">
      <svg class="brand-mark-svg" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 3 16 H 8 L 12 6 L 18 26 L 23 12 L 26 16 H 29"/>
      </svg>
      <h1 class="brand-title">Team Pulse</h1>
    </div>
    <nav class="main-nav" aria-label="Navigation principale">
      <a href="index.html" class="nav-link is-active">Baromètre</a>
      <a href="rapport-interactif.html" class="nav-link">Rapport interactif</a>
    </nav>
  </header>

  <!-- Main Container -->
  <main id="main-content" class="main-container" role="main" tabindex="-1">
    <!-- Dynamic Presentation Mode Panel (Injected if ?present=1) -->
    <div id="presentation-container"></div>

    <!-- Dynamic Demo Mode Bar (Injected if ?demo=1) -->
    <div id="demo-container"></div>

    <!-- Dynamic View Container -->
    <div id="view-card" class="view-card" tabindex="-1">
      <!-- Injected via src/app.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer" role="contentinfo">
    <p class="privacy-statement">Aucun nom n’est demandé. Les choix individuels restent toujours masqués.</p>
  </footer>

  <script type="module" src="src/app.js?v=20260806-checkin"></script>
</body>
</html>
