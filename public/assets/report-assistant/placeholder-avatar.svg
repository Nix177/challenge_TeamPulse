<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3EF" />
      <stop offset="100%" stop-color="#E8E4DC" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#126A5A" />
      <stop offset="100%" stop-color="#0B4339" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17231E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="320" rx="24" fill="url(#bgGrad)" stroke="#D4CEBE" stroke-width="2" />

  <!-- Avatar Badge Group -->
  <g transform="translate(160, 140)" filter="url(#shadow)">
    <!-- Base Outer Circle -->
    <circle r="72" fill="url(#avatarGrad)" />
    
    <!-- Pulse Wave Accents -->
    <circle r="60" fill="none" stroke="#84A98C" stroke-width="2" opacity="0.4" />
    <circle r="48" fill="none" stroke="#E5B365" stroke-width="2" opacity="0.4" />

    <!-- Head / Silhouette Icon -->
    <path d="M-28,32 C-28,12 -16,4 0,4 C16,4 28,12 28,32 Z" fill="#F5F3EF" opacity="0.95" />
    <circle cy="-14" r="22" fill="#F5F3EF" opacity="0.95" />

    <!-- Waveform / Microphone Motif -->
    <path d="M-12,-14 Q-6,-24 0,-14 Q6,-4 12,-14" fill="none" stroke="#126A5A" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Title Label -->
  <text x="160" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#126A5A" letter-spacing="0.03em">
    Assistant Rapport Team Pulse
  </text>
  <text x="160" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#5F6D66">
    RAG &amp; Gemini Live Voice
  </text>
</svg>
